<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Matul Trade — DEX Scanner</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh}
.app{max-width:480px;margin:0 auto;padding:16px}
.top-bar{text-align:center;padding:16px 0 14px}
.logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:6px}
.logo-icon{width:36px;height:36px;border-radius:50%;background:#1a3a1a;border:2px solid #4ade80;display:flex;align-items:center;justify-content:center;font-size:11px;color:#4ade80;font-weight:600}
.logo-name{font-size:13px;color:#c8f135;font-weight:600}
.app-title{font-size:28px;font-weight:600;color:#c8f135}
.app-sub{font-size:12px;color:#888;margin-top:3px}
.conn-badge{font-size:12px;color:#aaa;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#555}
.dot.on{background:#4ade80;animation:pulse 2s infinite}
.dot.scan{background:#f59e0b;animation:pulse .5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:#1a1a1a;border-radius:10px;padding:12px 14px;border:0.5px solid #2a2a2a}
.stat-label{font-size:10px;color:#555;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.stat-val{font-size:20px;font-weight:600;color:#38bdf8}
.stat-val.green{color:#4ade80}
.stat-val.sm{font-size:13px;color:#aaa;font-weight:400}
.controls{background:#1a1a1a;border-radius:10px;padding:12px;margin-bottom:12px;border:0.5px solid #2a2a2a}
.ctrl-row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.ctrl-group{display:flex;flex-direction:column;gap:4px}
.ctrl-label{font-size:10px;color:#555;text-transform:uppercase;letter-spacing:.5px}
.ctrl-input{background:#111;border:0.5px solid #333;border-radius:7px;color:#fff;font-size:13px;padding:7px 9px;width:88px;outline:none}
.ctrl-input:focus{border-color:#4ade80}
.btn-scan{background:#c8f135;color:#111;border:none;border-radius:7px;font-size:13px;font-weight:600;padding:9px 16px;cursor:pointer;display:flex;align-items:center;gap:5px}
.btn-auto{background:#1a2a1a;color:#4ade80;border:1px solid #4ade80;border-radius:7px;font-size:12px;padding:9px 11px;cursor:pointer}
.btn-auto.on{background:#4ade80;color:#111}
.tbl-header{display:grid;grid-template-columns:2.5fr 0.8fr 0.8fr 60px;gap:4px;padding:6px 10px;margin-bottom:5px}
.tbl-header span{font-size:10px;color:#444;font-weight:600;text-transform:uppercase}
.row{background:#1a1a1a;border-radius:8px;margin-bottom:6px;border:0.5px solid #2a2a2a;overflow:hidden}
.row.new{border-color:#4ade80}
.row.suspect{border-color:#4a2800}
.row-top{display:grid;grid-template-columns:2.5fr 0.8fr 0.8fr 60px;gap:4px;padding:10px;align-items:center}
.route-text{font-size:10px;color:#ddd;font-family:'Courier New',monospace;line-height:1.4}
.dex-badge{font-size:9px;color:#666;margin-top:2px}
.suspect-badge{font-size:9px;background:#4a2800;color:#f59e0b;border-radius:3px;padding:1px 4px;display:inline-block;margin-top:2px}
.profit-pos{font-size:12px;font-weight:600;color:#4ade80}
.profit-warn{font-size:12px;font-weight:600;color:#f59e0b}
.gain-val{font-size:11px;color:#4ade80;font-weight:500}
.btn-trade{background:#4ade80;color:#111;border:none;border-radius:6px;font-size:11px;font-weight:600;padding:7px 3px;cursor:pointer;width:100%}
.btn-trade.warn{background:#f59e0b}
.empty{text-align:center;color:#333;font-size:13px;padding:2rem 1rem;line-height:2}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.modal{background:#1a1a1a;border-radius:14px 14px 0 0;padding:20px 18px 28px;width:100%;max-width:480px;border-top:0.5px solid #333;max-height:88vh;overflow-y:auto}
.modal-handle{width:36px;height:4px;background:#333;border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:15px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid #222;font-size:13px}
.modal-row span:first-child{color:#666}
.modal-row .val{color:#fff;font-weight:500}
.modal-row .mono{font-family:'Courier New',monospace;font-size:10px;color:#888;text-align:right;max-width:55%}
.steps{margin-top:10px}
.step{display:flex;align-items:flex-start;gap:9px;padding:9px 0;border-bottom:0.5px solid #1a1a1a}
.step-num{min-width:22px;height:22px;border-radius:50%;background:#c8f135;color:#111;font-weight:700;font-size:11px;display:flex;align-items:center;justify-content:center}
.step-txt{font-size:12px;color:#bbb;line-height:1.5}
.step-txt strong{color:#fff}
.step-link{display:inline-block;margin-top:4px;font-size:11px;color:#38bdf8;text-decoration:none}
.warn-box{background:#2a1800;border:0.5px solid #4a2800;border-radius:7px;padding:10px;margin-top:12px;font-size:11px;color:#f59e0b;line-height:1.6}
.info-box{background:#0a2a1a;border:0.5px solid #1a4a2a;border-radius:7px;padding:10px;margin-top:8px;font-size:11px;color:#4ade80;line-height:1.7}
.modal-btns{display:flex;gap:8px;margin-top:16px}
.btn-cancel{flex:1;background:#222;color:#aaa;border:0.5px solid #333;border-radius:9px;padding:12px;cursor:pointer;font-size:13px}
.btn-go{flex:1;background:#4ade80;color:#111;border:none;border-radius:9px;padding:12px;cursor:pointer;font-size:13px;font-weight:600;text-decoration:none;text-align:center;display:flex;align-items:center;justify-content:center;gap:5px}
.footer{text-align:center;padding:16px 0 6px;font-size:10px;color:#2a2a2a}
.ticker{font-size:10px;color:#333;text-align:center;padding:3px 0 8px;font-family:'Courier New',monospace}
.liq-bar{height:2px;background:#111;border-radius:2px;margin-top:3px}
.liq-fill{height:100%;background:#4ade80;border-radius:2px}
.spinning{animation:spin 1s linear infinite}
.progress{font-size:11px;color:#888;text-align:center;padding:6px 0}
</style>
</head>
<body>
<div class="app">
  <div class="top-bar">
    <div class="logo-row">
      <div class="logo-icon">MT</div>
      <span class="logo-name">MatulMada</span>
    </div>
    <div class="app-title">Matul Trade</div>
    <div class="app-sub">DEX Arbitrage — BSC · ETH · Polygon</div>
    <div class="conn-badge"><span class="dot" id="dot"></span><span id="status-lbl">Prêt</span></div>
  </div>
  <div class="stat-row">
    <div class="stat-card"><div class="stat-label">Opportunités</div><div class="stat-val green" id="opp-count">0</div></div>
    <div class="stat-card"><div class="stat-label">Profit max</div><div class="stat-val green" id="max-profit">—</div></div>
  </div>
  <div class="stat-row">
    <div class="stat-card"><div class="stat-label">Capital (USDT)</div>
      <input id="capital-in" type="number" value="100" style="width:100%;background:transparent;border:none;color:#4ade80;font-size:18px;font-weight:600;padding:0;margin-top:3px;outline:none">
    </div>
    <div class="stat-card"><div class="stat-label">Dernière MAJ</div><div class="stat-val sm" id="last-upd">—</div></div>
  </div>
  <div class="controls">
    <div class="ctrl-row">
      <div class="ctrl-group"><span class="ctrl-label">Min profit %</span><input class="ctrl-input" type="number" id="min-p" value="0.05" step="0.01" min="0.01"></div>
      <div class="ctrl-group"><span class="ctrl-label">Min liq $</span><input class="ctrl-input" type="number" id="min-liq" value="5000" step="1000"></div>
      <button class="btn-scan" onclick="doScan()"><i class="ti ti-refresh" id="scan-ic"></i> Scan</button>
      <button class="btn-auto" id="auto-btn" onclick="toggleAuto()"><i class="ti ti-player-play" id="auto-ic"></i></button>
    </div>
    <div class="progress" id="progress"></div>
  </div>
  <div class="tbl-header"><span>Route</span><span>Profit</span><span>Gain</span><span>Trade</span></div>
  <div id="results"><div class="empty"><i class="ti ti-arrows-exchange" style="font-size:36px;color:#222;display:block;margin-bottom:12px"></i>Tsindrio Scan<br><span style="font-size:11px;color:#444">BSC · ETH · Polygon · 50+ pairs</span></div></div>
  <div class="ticker" id="ticker"></div>
  <div class="footer">Matul Trade © 2025 — Fitia tech · DexScreener API</div>
</div>
<div class="overlay" id="overlay" onclick="closeIfBg(event)">
  <div class="modal"><div class="modal-handle"></div><div id="modal-content"></div></div>
</div>
<script>
let scanData=[],autoInt=null,autoOn=false;
const QUERIES=['WBNB USDT','CAKE USDT','ETH USDT','BTC USDT','SOL USDT','XRP USDT','ADA USDT','DOT USDT','LINK USDT','MATIC USDT','AVAX USDT','DOGE USDT','UNI USDT','ATOM USDT','LTC USDT','NEAR USDT','FTM USDT','SAND USDT','AAVE USDT','CRV USDT'];
async function fetchQuery(q){
  try{const r=await fetch('https://api.dexscreener.com/latest/dex/search?q='+encodeURIComponent(q));const d=await r.json();
  return(d.pairs||[]).filter(p=>['bsc','ethereum','polygon'].includes(p.chainId)&&parseFloat(p.liquidity?.usd||0)>3000&&parseFloat(p.priceUsd||0)>0);}catch(e){return[];}
}
async function fetchAll(onP){
  let all=[];
  for(let i=0;i<QUERIES.length;i++){onP('Scanning... '+( i+1)+'/'+QUERIES.length);const r=await fetchQuery(QUERIES[i]);all=all.concat(r);await new Promise(r=>setTimeout(r,150));}
  const seen=new Set();return all.filter(p=>{if(!p.pairAddress||seen.has(p.pairAddress))return false;seen.add(p.pairAddress);return true;});
}
function buildMap(pairs){
  const pm={};
  pairs.forEach(p=>{const sym=p.baseToken?.symbol,price=parseFloat(p.priceUsd||0),liq=parseFloat(p.liquidity?.usd||0),dex=p.dexId||'?',chain=p.chainId||'bsc';
  if(!sym||!price||liq<3000)return;const key=sym+'_'+chain;if(!pm[key]||liq>pm[key].l)pm[key]={p:price,l:liq,d:dex,sym,chain};});return pm;
}
function calcOpps(pm,minP,minLiq){
  const FEE=0.003,res=[],keys=Object.keys(pm);
  for(let i=0;i<keys.length;i++)for(let j=i+1;j<keys.length;j++){
    const ka=keys[i],kb=keys[j],A=pm[ka],B=pm[kb];
    if(A.chain!==B.chain)continue;
    const liq=Math.min(A.l,B.l);if(liq<minLiq)continue;
    const altK=keys.filter(k=>pm[k].sym===A.sym&&pm[k].chain===A.chain&&pm[k].d!==A.d);
    if(altK.length>0){
      const altA=pm[altK[0]];
      const spread=Math.abs(A.p-altA.p)/Math.min(A.p,altA.p)*100;
      const net=spread-FEE*3*100;
      if(net>=minP&&net<=10&&isFinite(net)){
        res.push({route:'USDT→'+A.sym+'('+A.d+')→'+A.sym+'('+altA.d+')→USDT',profit:parseFloat(net.toFixed(4)),liq:Math.min(A.l,altA.l),dex:A.d+' vs '+altA.d,chain:A.chain,suspect:net>3});
      }
    }
  }
  const unique=[],seen=new Set();
  res.sort((a,b)=>b.profit-a.profit).forEach(r=>{if(!seen.has(r.route)){seen.add(r.route);unique.push(r);}});
  return unique.slice(0,20);
}
async function doScan(){
  const ic=document.getElementById('scan-ic');ic.className='ti ti-refresh spinning';
  document.getElementById('dot').className='dot scan';document.getElementById('status-lbl').textContent='Scanning...';
  try{
    const minP=parseFloat(document.getElementById('min-p').value)||0.05;
    const minLiq=parseFloat(document.getElementById('min-liq').value)||5000;
    const capital=parseFloat(document.getElementById('capital-in').value)||100;
    const pairs=await fetchAll(msg=>{document.getElementById('progress').textContent=msg;});
    const pm=buildMap(pairs);const results=calcOpps(pm,minP,minLiq);
    scanData=results.map(r=>({...r,capital,gain:parseFloat((r.profit/100*capital).toFixed(4))}));
    document.getElementById('opp-count').textContent=scanData.length;
    document.getElementById('max-profit').textContent=scanData.length?scanData[0].profit.toFixed(3)+'%':'0%';
    document.getElementById('last-upd').textContent=new Date().toLocaleTimeString();
    document.getElementById('ticker').textContent='Pairs: '+pairs.length+' · '+new Date().toLocaleTimeString();
    document.getElementById('dot').className='dot on';document.getElementById('status-lbl').textContent='Live — '+pairs.length+' pairs';
    document.getElementById('progress').textContent='';renderTable(scanData);
  }catch(e){document.getElementById('dot').className='dot';document.getElementById('status-lbl').textContent='Erreur';document.getElementById('progress').textContent='';}
  ic.className='ti ti-refresh';
}
function renderTable(data){
  const el=document.getElementById('results');
  if(!data||!data.length){el.innerHTML='<div class="empty"><i class="ti ti-mood-empty" style="font-size:32px;color:#222;display:block;margin-bottom:10px"></i>Tsy misy opportunité izao<br><span style="font-size:11px;color:#333">Avereno 8h–12h na 18h–22h</span></div>';return;}
  const mx=Math.max(...data.map(r=>r.liq));
  el.innerHTML=data.map((r,i)=>'<div class="row'+(r.suspect?' suspect':' new')+'"><div class="row-top"><div><span class="route-text">'+r.route+'</span>'+(r.suspect?'<span class="suspect-badge">⚠</span>':'')+'<div class="dex-badge">'+r.chain+' · $'+(r.liq/1000).toFixed(0)+'k</div><div class="liq-bar"><div class="liq-fill" style="width:'+(r.liq/mx*100).toFixed(0)+'%"></div></div></div><span class="'+(r.suspect?'profit-warn':'profit-pos')+'">+'+r.profit.toFixed(3)+'%</span><span class="gain-val">+'+r.gain+'<br><span style="font-size:9px;color:#555">USDT</span></span><button class="btn-trade'+(r.suspect?' warn':'')+'" onclick="showTrade('+i+')"><i class="ti ti-player-play"></i></button></div></div>').join('');
}
function showTrade(i){
  const r=scanData[i],pts=r.route.split('→');
  document.getElementById('modal-content').innerHTML='<div class="modal-title" style="color:#4ade80"><i class="ti ti-arrows-exchange"></i> Exécution DEX</div><div class="modal-row"><span>Route</span><span class="mono">'+r.route+'</span></div><div class="modal-row"><span>Profit</span><span class="val" style="color:#4ade80">+'+r.profit.toFixed(4)+'%</span></div><div class="modal-row"><span>Gain</span><span class="val" style="color:#4ade80">+'+r.gain+' USDT</span></div><div class="modal-row"><span>Capital</span><span class="val">'+r.capital+' USDT</span></div><div class="modal-row"><span>Réseau</span><span class="val">'+r.chain+'</span></div><div style="margin-top:12px;font-size:12px;color:#777;margin-bottom:6px">Étapes:</div><div class="steps"><div class="step"><span class="step-num">1</span><div class="step-txt">Sokafy <strong>PancakeSwap</strong><br><a class="step-link" href="https://pancakeswap.finance/swap" target="_blank">pancakeswap.finance ↗</a></div></div><div class="step"><span class="step-num">2</span><div class="step-txt">Swap <strong>'+(pts[0]||'USDT')+'</strong> → <strong>'+(pts[1]||'?')+'</strong></div></div><div class="step"><span class="step-num">3</span><div class="step-txt">Swap → <strong>'+(pts[2]||'?')+'</strong> → <span style="color:#4ade80">+'+r.gain+' USDT</span></div></div></div><div class="info-box"><i class="ti ti-bulb"></i> Active: 8h–12h sy 18h–22h. Mila BNB gas.</div><div class="modal-btns"><button class="btn-cancel" onclick="closeModal()">Fermer</button><a class="btn-go" href="https://pancakeswap.finance/swap" target="_blank">PancakeSwap ↗</a></div>';
  openModal();
}
function toggleAuto(){autoOn=!autoOn;const b=document.getElementById('auto-btn'),ic=document.getElementById('auto-ic');if(autoOn){b.className='btn-auto on';ic.className='ti ti-player-pause';doScan();autoInt=setInterval(doScan,90000);}else{b.className='btn-auto';ic.className='ti ti-player-play';clearInterval(autoInt);}}
function openModal(){document.getElementById('overlay').className='overlay show';}
function closeModal(){document.getElementById('overlay').className='overlay';}
function closeIfBg(e){if(e.target===document.getElementById('overlay'))closeModal();}
</script>
</body>
</html>
